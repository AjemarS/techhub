name: CI

# PRs run the checks; main also deploys staging; a v* tag deploys prod after approval
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  COMPOSE: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml

# Runner image pinned: ubuntu-latest moves to 26.04 during Oct–Nov 2026, and an image switch can change
# system packages (Playwright --with-deps), Docker and Compose under us. Bump deliberately, in its own PR.
jobs:
  lint-product-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: product-service/requirements.txt
      - run: pip install ruff mypy django-stubs djangorestframework-stubs types-django-filter -r product-service/requirements.txt ./shared-lib
      - run: ruff check product-service/
      - run: mypy .
        working-directory: product-service

  lint-auth-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
        working-directory: auth-service
      - run: npm run lint
        working-directory: auth-service
      - run: npm run typecheck
        working-directory: auth-service

  lint-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test-product-service:
    runs-on: ubuntu-24.04
    needs: [lint-product-service]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DEBUG: "True"
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: product-service/requirements.txt
      - run: pip install -r product-service/requirements.txt ./shared-lib
      - run: python manage.py migrate
        working-directory: product-service
      - run: python manage.py test
        working-directory: product-service

  test-stock-services:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [inventory-service, order-service]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DEBUG: "True"
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - run: pip install -r ${{ matrix.service }}/requirements.txt ./shared-lib
      - run: python manage.py test --noinput
        working-directory: ${{ matrix.service }}

  test-auth-service:
    runs-on: ubuntu-24.04
    needs: [lint-auth-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
        working-directory: auth-service
      - run: npm run test
        working-directory: auth-service

  test-frontend:
    runs-on: ubuntu-24.04
    needs: [lint-frontend]
    # Browsers and their system libraries come with the image: `playwright install --with-deps` took up to
    # 46 min when apt mirrors were slow. Same image the visual baselines are made in (AGENTS.md); keep its
    # tag in step with @playwright/test in frontend/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  test-notification-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: notification-service/package-lock.json
      - run: npm ci
        working-directory: notification-service
      - run: npx tsc --noEmit
        working-directory: notification-service
      - run: npm test
        working-directory: notification-service

  build-docker:
    runs-on: ubuntu-24.04
    needs: [lint-product-service, lint-auth-service, lint-frontend, test-product-service, test-stock-services, test-auth-service, test-frontend, test-notification-service]
    steps:
      - uses: actions/checkout@v4
      # the images that ship, so a broken prod Dockerfile fails the PR
      - run: |
          export REGISTRY=${REGISTRY,,}
          $COMPOSE build

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r product-service/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: auth-service/package-lock.json
      - run: npm ci
        working-directory: auth-service
      - run: npm audit --production --audit-level=high
        working-directory: auth-service
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --production --audit-level=high
        working-directory: frontend

  # Backend and gateway images are the same in every environment, tagged with the commit
  publish-images:
    if: github.event_name == 'push'
    needs: [build-docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.sha }}
      SERVICES: product-service inventory-service order-service auth-service notification-service audit-service gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          export REGISTRY=${REGISTRY,,}
          # COMPOSE and SERVICES are word lists, split on purpose
          # shellcheck disable=SC2086
          $COMPOSE build $SERVICES
          # shellcheck disable=SC2086
          $COMPOSE push $SERVICES

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [publish-images]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: staging
    secrets: inherit

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-images]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: prod
    secrets: inherit
