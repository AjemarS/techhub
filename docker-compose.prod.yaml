# Production override. Several stacks (staging, prod) can share one host:
#   TAG=<git sha> DEPLOY_ENV=prod docker compose -p techhub-prod -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# container_name is reset so the compose project name keeps containers apart, and images are named
# ${REGISTRY}/<service>:${TAG} so CI can build them and the host only pulls (deploy/deploy.sh).

services:
  # Databases — Remove host port exposure
  products_db:
    container_name: !reset null
    ports: !reset []

  inventory_db:
    container_name: !reset null
    ports: !reset []

  orders_db:
    container_name: !reset null
    ports: !reset []

  auth_db:
    container_name: !reset null
    ports: !reset []

  logging_db:
    container_name: !reset null
    ports: !reset []

  # Django Product Service
  product-service:
    image: ${REGISTRY:-techhub}/product-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: product-service/Dockerfile
      target: prod
    # uploaded product and category images outlive the container
    volumes: !override
      - product_media:/app/media
    ports: !reset []
    environment:
      DEBUG: "False"
    # the image CMD: migrate, collectstatic, gunicorn (WEB_CONCURRENCY workers, 2 by default)
    command: !reset null
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"

  # Django Inventory Service
  inventory-service:
    image: ${REGISTRY:-techhub}/inventory-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
      target: prod
    volumes: !reset []
    ports: !reset []
    environment:
      DEBUG: "False"
    # the image CMD: migrate, collectstatic, gunicorn (WEB_CONCURRENCY workers, 2 by default)
    command: !reset null
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"

  # Django Order Service
  order-service:
    image: ${REGISTRY:-techhub}/order-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: order-service/Dockerfile
      target: prod
    volumes: !reset []
    ports: !reset []
    environment:
      DEBUG: "False"
      # Workers mostly wait on catalog and inventory calls, so more of them fit in one CPU
      WEB_CONCURRENCY: "4"
    # the image CMD: migrate, collectstatic, gunicorn (WEB_CONCURRENCY workers, 2 by default)
    command: !reset null
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/orders/health/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"

  # Auth Service (Better Auth)
  auth-service:
    image: ${REGISTRY:-techhub}/auth-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      target: prod
    volumes: !reset []
    ports: !reset []
    environment:
      NODE_ENV: "production"
      LOG_LEVEL: "info"
    command: node dist/index.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  # Next.js Frontend
  frontend:
    # NEXT_PUBLIC_* are inlined at build time, so each environment has its own frontend image
    image: ${REGISTRY:-techhub}/frontend:${DEPLOY_ENV:-local}-${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
    volumes: !reset []
    ports: !reset []
    environment:
      NODE_ENV: "production"
    command: node server.js
    healthcheck:
      # 127.0.0.1: localhost is ::1 in alpine and Next listens on IPv4 only
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"

  # API Gateway (Nginx)
  gateway:
    image: ${REGISTRY:-techhub}/gateway:${TAG:-latest}
    container_name: !reset null
    # behind a host TLS proxy, bind e.g. 127.0.0.1:8080 (prod) and 127.0.0.1:8081 (staging)
    ports: !override
      - "${GATEWAY_BIND:-80}:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
        reservations:
          cpus: "0.25"
          memory: "64M"

  # Notification Service
  notification-service:
    image: ${REGISTRY:-techhub}/notification-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      target: prod
    command: !reset null
    volumes: !reset []
    environment:
      NODE_ENV: "production"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  # Audit Service
  audit-service:
    image: ${REGISTRY:-techhub}/audit-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: audit-service/Dockerfile
      target: prod
    command: !reset null
    volumes: !reset []
    environment:
      NODE_ENV: "production"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.125"
          memory: "64M"

  # Product Event Consumer (same image as product-service)
  product-consumer:
    # the image HEALTHCHECK probes product-service HTTP, which the consumer does not serve
    healthcheck:
      disable: true
    image: ${REGISTRY:-techhub}/product-service:${TAG:-latest}
    container_name: !reset null
    build:
      context: .
      dockerfile: product-service/Dockerfile
      target: prod
    volumes: !reset []
    environment:
      DEBUG: "False"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  # RabbitMQ (event bus)
  rabbitmq:
    container_name: !reset null
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  # Redis
  redis:
    container_name: !reset null
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.125"
          memory: "64M"


  prometheus:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"

  grafana:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

volumes:
  product_media:

networks:
  microservices_network:
    driver: bridge
