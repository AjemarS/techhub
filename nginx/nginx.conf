user nginx;
worker_processes auto;
pid /run/nginx.pid;

# Pass CORS_ORIGINS to workers: njs process.env sees only variables listed here
env CORS_ORIGINS;

load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── njs import ──
    js_import auth from /etc/nginx/auth.js;
    js_import cors from /etc/nginx/cors.js;
    js_import health from /etc/nginx/health.js;

    # ── Logging ──
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"bytes_sent":$bytes_sent'
    '}';

    access_log /dev/stdout json;
    error_log stderr info;

    # Caddy terminates TLS in front of the gateway: keep its scheme, fall back to ours without it (dev)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ── Rate limiting: online order creation only (POST /api/orders/); empty key = not limited ──
    map "$request_method:$uri" $orders_create_key {
        default "";
        "~^POST:/api/orders/?$" $binary_remote_addr;
    }
    limit_req_zone $orders_create_key zone=orders_create:10m rate=10r/m;
    limit_req_status 429;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    proxy_buffering on;
    proxy_http_version 1.1;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # A container that restarts can come back on another IP. proxy_pass to a host name resolves once at
    # startup, so the gateway kept the old address (502 after audit-service restarted in the K6 run);
    # these groups re-resolve through Docker DNS (resolver above) every 10 s while running.
    upstream auth-service         { zone upstreams 256k; server auth-service:3001 resolve; }
    upstream product-service      { zone upstreams 256k; server product-service:8000 resolve; }
    upstream inventory-service    { zone upstreams 256k; server inventory-service:8001 resolve; }
    upstream order-service        { zone upstreams 256k; server order-service:8002 resolve; }
    upstream notification-service { zone upstreams 256k; server notification-service:8003 resolve; }
    upstream audit-service        { zone upstreams 256k; server audit-service:8005 resolve; }
    upstream frontend             { zone upstreams 256k; server frontend:3000 resolve; }

    server_tokens off;

    # ── HSTS map (enable only when proxied over HTTPS) ──
    map $http_x_forwarded_proto $hsts_header {
        default "";
        "https" "max-age=31536000; includeSubDomains";
    }

    # ── CORS (njs-driven, env-aware) ──
    js_set $cors_allow_origin cors.checkOrigin;

    # The frontend sends its own per-request CSP with a script nonce (frontend/proxy.ts); pass it through.
    # Everything else (JSON APIs, gateway errors, media) gets a locked-down default.
    map $upstream_http_content_security_policy $gateway_csp {
        ""      "default-src 'none'; frame-ancestors 'none'";
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Main server ──
    server {
        listen 8080;
        server_name _;

        # Declare custom auth variables (set by njs at runtime, used in proxy_includes)
        set $gateway_user_id "";
        set $gateway_user_role "user";
        set $gateway_user_email "";
        set $gateway_user_name "";
        set $auth_user_id "";
        set $auth_user_role "user";
        set $auth_user_email "";
        set $auth_user_name "";

        # ── Internal auth check (API routes) ──
        # 401 IS intercepted → returns 200 with empty headers → njs allows anonymous access
        location = /auth-check {
            internal;
            proxy_pass http://auth-service/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Intercept errors for graceful degradation
            # 401 intercepted — anonymous API routes need empty headers
            # 502 NOT intercepted — auth-service failure propagates as 502
            proxy_intercept_errors on;
            error_page 400 401 403 404 500 503 504 =200;
        }

        # ── Internal auth check (admin page) ──
        # 401 NOT intercepted — auth_request needs real 401 to deny unauthenticated access
        location = /auth-check-admin {
            internal;
            proxy_pass http://auth-service/auth/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_intercept_errors on;
            error_page 400 403 404 500 503 504 =200;
        }

        # ── Gateway health ──
        location = /gateway {
            default_type application/json;
            return 200 '{"message":"API Gateway is running."}';
        }

        # Real per-service status (admin dashboard); always 200, overall "status" is healthy/degraded
        location = /health {
            js_content health.aggregate;
        }

        location /_health/ {
            internal;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            location = /_health/product      { proxy_pass http://product-service/api/health/; }
            location = /_health/inventory    { proxy_pass http://inventory-service/api/health/; }
            location = /_health/order        { proxy_pass http://order-service/api/orders/health/; }
            location = /_health/auth         { proxy_pass http://auth-service/health; }
            location = /_health/notification { proxy_pass http://notification-service/health; }
            # HEAD: only the status matters, and the page body would not fit the subrequest buffer
            location = /_health/frontend     { proxy_method HEAD; proxy_pass http://frontend/; }
        }

        # ── Root → frontend ──
        location = / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Stripe webhook (no auth, path rewrite) ──
        location /api/payments/webhook {
            proxy_pass http://order-service/api/orders/stripe_webhook/;
            include /etc/nginx/proxy_public.conf;
        }

        # ── Inventory health (no auth — AllowAny) ──
        location /api/inventory/health {
            proxy_pass http://inventory-service/api/health/;
            include /etc/nginx/proxy_public.conf;
        }

        # ── API routes (conditional auth) ──
        location /api/inventory/ {
            set $api_backend @api_inventory_backend;
            set $api_access inventory;
            rewrite ^/api/inventory/(.*) /api/$1 break;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/orders/ {
            set $api_backend @api_orders_backend;
            set $api_access orders;
            limit_req zone=orders_create burst=5 nodelay;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/reports/ {
            set $api_backend @api_reports_backend;
            set $api_access reports;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/notifications/stream {
            set $api_backend @api_notifications_stream;
            set $api_access notifications;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location @api_notifications_stream {
            proxy_pass http://notification-service;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            include /etc/nginx/proxy_api.conf;
        }

        location /api/notifications {
            set $api_backend @api_notifications_backend;
            set $api_access notifications;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/cart/ {
            set $api_backend @api_cart_backend;
            set $api_access cart;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        # ── Product health (no auth — AllowAny) ──
        location /api/products/health {
            proxy_pass http://product-service/api/health/;
            include /etc/nginx/proxy_public.conf;
        }

        location /api/ {
            set $api_backend @api_product_backend;
            set $api_access product;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        # ── Audit logs: admin-only reads; ingest (POST /api/audit/log) stays internal ──
        location = /api/audit/health {
            proxy_pass http://audit-service;
            include /etc/nginx/proxy_public.conf;
        }

        location = /api/audit/logs {
            set $api_backend @api_audit_backend;
            set $api_access audit;
            auth_request /auth-check;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_name $upstream_http_x_user_name;
            js_content auth.checkAndProxy;
        }

        location /api/audit/ {
            return 404;
        }

        # ── Media (no auth) ──
        location /media/ {
            proxy_pass http://product-service;
            proxy_buffering off;
            proxy_request_buffering off;
            include /etc/nginx/proxy_media.conf;
        }

        # ── Auth passthrough (no auth) ──
        location /auth/ {
            proxy_pass http://auth-service;
            include /etc/nginx/proxy_public.conf;
        }

        # ── Admin page auth backstop (frontend proxy.ts handles role checks) ──
        # auth_request denies non-2xx automatically — no if needed
        location ~ ^/(ua|en)/admin {
            auth_request /auth-check-admin;
            proxy_pass http://frontend;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Frontend catch-all ──
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_frontend.conf;
        }

        # ── Named proxy backends (used by njs after auth) ──
        location @api_inventory_backend {
            proxy_pass http://inventory-service;
            include /etc/nginx/proxy_api.conf;
            # Served at /api/inventory/ but forwarded as /api/: links the service builds need the public prefix
            proxy_set_header X-Forwarded-Prefix /api/inventory;
        }

        location @api_orders_backend {
            proxy_pass http://order-service;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_reports_backend {
            proxy_pass http://order-service;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_notifications_backend {
            proxy_pass http://notification-service;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_cart_backend {
            proxy_pass http://product-service;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_product_backend {
            proxy_pass http://product-service;
            include /etc/nginx/proxy_api.conf;
        }

        location @api_audit_backend {
            proxy_pass http://audit-service;
            include /etc/nginx/proxy_api.conf;
        }

        # ── Security headers on all responses ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy $gateway_csp always;

        # ── CORS headers on all responses ──
        # Applied at server level so all locations inherit
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Gateway-User-Id, X-Gateway-User-Role, X-Session-Id" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
