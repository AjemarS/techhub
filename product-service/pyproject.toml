[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# seed catalogue: long product descriptions read better unwrapped
"products/management/commands/seed_data.py" = ["E501"]
"product_service/test_settings.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["products", "product_service"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["products.models", "products.cart_models"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["products.*"]
disable_error_code = ["attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "rest_framework.*",
    "django_filters.*",
    "pika.*",
    "django.*",
    "drf_spectacular.*",
    "shared_auth.*",
    "shared_eventbus.*",
    "shared_metrics",
    "shared_metrics.*",
    "requests",
]
ignore_missing_imports = true
