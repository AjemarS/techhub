services:
  # Products Database
  products_db:
    image: postgres:15-alpine
    container_name: products_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRODUCTS_DB_NAME:-products_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_products_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${PRODUCTS_DB_NAME:-products_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Inventory Database
  inventory_db:
    image: postgres:15-alpine
    container_name: inventory_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Orders Database
  orders_db:
    image: postgres:15-alpine
    container_name: orders_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Auth Database
  auth_db:
    image: postgres:15-alpine
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Logging Database (shared between audit and notification services)
  logging_db:
    image: postgres:15-alpine
    container_name: logging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOGGING_DB_NAME:-logging_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_logging_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${LOGGING_DB_NAME:-logging_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_network

  # Django Product Service
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
      target: dev
    container_name: product_service
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@products_db:5432/${PRODUCTS_DB_NAME:-products_db}
      DB_NAME: ${PRODUCTS_DB_NAME:-products_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: products_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: product_service.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./product-service:/app
      - ./shared-lib:/shared-lib
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      products_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "rm -rf $$PROMETHEUS_MULTIPROC_DIR && mkdir -p $$PROMETHEUS_MULTIPROC_DIR && python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn product_service.wsgi:application -w 2 --reload --reload-extra-file /shared-lib --bind 0.0.0.0:8000 --log-level debug"

  # Auth Service (Better Auth)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: dev
    container_name: auth_service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_PORT}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@auth_db:5432/${AUTH_DB_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      auth_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install && npm run migrate && npm run dev"
    networks:
      - microservices_network

  # Django Inventory Service
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
      target: dev
    container_name: inventory_service
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@inventory_db:5432/${INVENTORY_DB_NAME}
      DB_NAME: ${INVENTORY_DB_NAME}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: inventory_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: inventory_service.settings
      DJANGO_SECRET_KEY: ${INVENTORY_DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    volumes:
      - ./inventory-service:/app
      - ./shared-lib:/shared-lib
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      inventory_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "rm -rf $$PROMETHEUS_MULTIPROC_DIR && mkdir -p $$PROMETHEUS_MULTIPROC_DIR && python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn inventory_service.wsgi:application -w 2 --reload --reload-extra-file /shared-lib --bind 0.0.0.0:8001 --log-level debug"

  # Django Order Service
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
      target: dev
    container_name: order_service
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@orders_db:5432/${ORDERS_DB_NAME}
      DB_NAME: ${ORDERS_DB_NAME}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: orders_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: order_service.settings
      DJANGO_SECRET_KEY: ${ORDERS_DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DEFAULT_FULFILMENT_WAREHOUSE_ID: ${DEFAULT_FULFILMENT_WAREHOUSE_ID:-}
      RABBITMQ_URL: ${RABBITMQ_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./order-service:/app
      - ./shared-lib:/shared-lib
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      orders_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: >
      sh -c "rm -rf $$PROMETHEUS_MULTIPROC_DIR && mkdir -p $$PROMETHEUS_MULTIPROC_DIR && python manage.py migrate &&
             python manage.py seed_orders &&
             gunicorn order_service.wsgi:application -w 2 --reload --reload-extra-file /shared-lib --bind 0.0.0.0:8002 --log-level debug"

  # Notification Service (Node.js - RabbitMQ consumer + Resend)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: dev
    container_name: notification_service
    restart: unless-stopped
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    environment:
      PORT: "8003"
      RABBITMQ_URL: ${RABBITMQ_URL}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      NOTIFICATIONS_DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@logging_db:5432/${LOGGING_DB_NAME:-logging_db}
    depends_on:
      rabbitmq:
        condition: service_healthy
      logging_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: sh -c "npm install && npm run dev"

  # Audit Service (centralized logging)
  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
      target: dev
    container_name: audit_service
    restart: unless-stopped
    volumes:
      - ./audit-service:/app
      - /app/node_modules
    environment:
      PORT: "8005"
      RABBITMQ_URL: ${RABBITMQ_URL}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@logging_db:5432/${LOGGING_DB_NAME:-logging_db}
    depends_on:
      rabbitmq:
        condition: service_healthy
      logging_db:
        condition: service_healthy
    networks:
      - microservices_network
    command: sh -c "npm install && npm run dev"

  # Product Event Consumer (RabbitMQ)
  product-consumer:
    build:
      context: .
      dockerfile: product-service/Dockerfile
      target: dev
    container_name: product_consumer
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@products_db:5432/${PRODUCTS_DB_NAME:-products_db}
      DB_NAME: ${PRODUCTS_DB_NAME:-products_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: products_db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: product_service.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./product-service:/app
      - ./shared-lib:/shared-lib
    depends_on:
      products_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices_network
    command: python manage.py consume_events

  # API Gateway (Nginx)
  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    ports:
      - "80:8080"
    depends_on:
      - product-service
      - inventory-service
      - order-service
      - frontend
      - auth-service
      - audit-service
      - notification-service
    networks:
      - microservices_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: frontend_app
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
      - API_SERVICE_URL=${API_GATEWAY_URL:-http://gateway:8080/api}
      - PROXY_AUTH_URL=${PROXY_AUTH_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_cache:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - microservices_network
    command: sh -c "npm install && npm run dev"

  # RabbitMQ (event bus)
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - microservices_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # Below the 128M container limit; only keys with a TTL (cache entries) are evicted, never auth's
    command: redis-server --maxmemory 96mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - microservices_network

  # Monitoring: Prometheus scrapes /metrics of every service, Grafana shows monitoring/grafana/dashboards
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - microservices_network

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Default admin/admin is only reachable on loopback, and Grafana asks to change it at first login
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Loopback only: open it through an SSH tunnel; staging and prod on one host need different ports
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    networks:
      - microservices_network

volumes:
  prometheus_data:
  grafana_data:
  postgres_products_data:
  postgres_inventory_data:
  postgres_orders_data:
  postgres_auth_data:
  postgres_logging_data:
  redis_data:
  next_cache:

networks:
  microservices_network:
    driver: bridge
